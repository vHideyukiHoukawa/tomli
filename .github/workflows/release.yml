name: Build and release

permissions:
  contents: write

on:
  push:
    tags:
      - "*"

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: tomli # Parameterize the project name

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            os_name: linux
            arch_name: amd64
            file_ext: tar.gz
          - os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            os_name: linux
            arch_name: arm64
            file_ext: tar.gz
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            os_name: darwin
            arch_name: amd64
            file_ext: tar.gz
          - os: macos-14
            rust_target: aarch64-apple-darwin
            os_name: darwin
            arch_name: arm64
            file_ext: tar.gz
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            os_name: windows
            arch_name: amd64
            file_ext: zip
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust_target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust target and cross-compilation tools
        run: |
          rustup target add ${{ matrix.rust_target }}
          if [ "${{ matrix.rust_target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu
            mkdir -p .cargo
            echo '[target.aarch64-unknown-linux-gnu]' > .cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml
          fi
        if: ${{ matrix.os != 'windows-latest' }} # rustup is not available on windows-latest by default

      - name: Build binary
        run: cargo build --verbose --release --target ${{ matrix.rust_target }}

      - name: Prepare artifact
        run: |
          # Use VERSION directly (includes 'v' prefix if present in tag)
          ARTIFACT_NAME="${{ env.PROJECT_NAME }}-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch_name }}"

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/${{ matrix.rust_target }}/release/${{ env.PROJECT_NAME }}.exe ${ARTIFACT_NAME}.exe
            7z a ${ARTIFACT_NAME}.zip ${ARTIFACT_NAME}.exe CHANGELOG.md LICENSE
            sha256sum ${ARTIFACT_NAME}.zip > ${ARTIFACT_NAME}.zip.sha256
          elif [[ "${{ matrix.os }}" == macos-* ]]; then
            mv target/${{ matrix.rust_target }}/release/${{ env.PROJECT_NAME }} ${ARTIFACT_NAME}
            tar -czf ${ARTIFACT_NAME}.tar.gz ${ARTIFACT_NAME} CHANGELOG.md LICENSE
            shasum -a 256 ${ARTIFACT_NAME}.tar.gz > ${ARTIFACT_NAME}.tar.gz.sha256
          else # Linux
            mv target/${{ matrix.rust_target }}/release/${{ env.PROJECT_NAME }} ${ARTIFACT_NAME}
            tar -czf ${ARTIFACT_NAME}.tar.gz ${ARTIFACT_NAME} CHANGELOG.md LICENSE
            sha256sum ${ARTIFACT_NAME}.tar.gz > ${ARTIFACT_NAME}.tar.gz.sha256
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.os }}-${{ matrix.arch_name }}
          path: |
            ${{ env.ARTIFACT_NAME }}.*
            ${{ env.ARTIFACT_NAME }}.*.sha256

  create-universal-macos-binary:
    needs: build
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # Download individual macOS artifacts
      - name: Download macOS AMD64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-macos-latest-amd64
          path: artifacts/macos-amd64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-macos-14-arm64
          path: artifacts/macos-arm64

      # Extract binaries and combine with lipo
      - name: Create Universal macOS Binary
        run: |
          # Extract AMD64 binary from its archive
          tar -xzf artifacts/macos-amd64/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-darwin-amd64.tar.gz -C artifacts/macos-amd64
          # Extract ARM64 binary from its archive
          tar -xzf artifacts/macos-arm64/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-darwin-arm64.tar.gz -C artifacts/macos-arm64

          # Combine with lipo
          lipo -create \
            artifacts/macos-amd64/${{ env.PROJECT_NAME }} \
            artifacts/macos-arm64/${{ env.PROJECT_NAME }} \
            -output ${{ env.PROJECT_NAME }} # Output the universal binary to the root

          # Create universal archive
          tar -czf ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-darwin-universal.tar.gz \
            ${{ env.PROJECT_NAME }} CHANGELOG.md LICENSE

          # Generate checksum for universal binary
          shasum -a 256 ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-darwin-universal.tar.gz > ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-darwin-universal.tar.gz.sha256
        shell: bash

      - name: Upload Universal macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-darwin-universal
          path: |
            ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-darwin-universal.tar.gz
            ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-darwin-universal.tar.gz.sha256

  release:
    needs: [build, create-universal-macos-binary]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-*.tar.gz
            artifacts/*/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-*.zip
            artifacts/*/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-*.sha256
